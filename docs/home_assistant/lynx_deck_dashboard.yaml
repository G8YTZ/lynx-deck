# Lynx Deck: a section for a Home Assistant Sections dashboard.
# On the dashboard: edit mode, Create section, then the section's three dots,
# Edit in YAML; select all and paste this file. Needs the sensors in
# lynx_deck_sensors.yaml. GB3OO's layout: Lynx-Tx, Lynx Deck, PA and UPS.
type: grid
cards:
- type: heading
  heading: Lynx Deck
  icon: mdi:play-box-multiple
- type: tile
  entity: sensor.lynx_deck_state
  name: Lynx Deck
  color: green
  grid_options:
    columns: 4
  visibility:
  - condition: state
    entity: sensor.lynx_deck_state
    state: playing
- type: tile
  entity: sensor.lynx_deck_state
  name: Lynx Deck
  color: teal
  grid_options:
    columns: 4
  visibility:
  - condition: state
    entity: sensor.lynx_deck_state
    state: stopped
- type: tile
  entity: sensor.lynx_deck_state
  name: Lynx Deck
  color: red
  grid_options:
    columns: 4
  visibility:
  - condition: state
    entity: sensor.lynx_deck_state
    state_not:
    - playing
    - stopped
- type: tile
  entity: sensor.lynx_deck_player
  name: Player
  color: green
  grid_options:
    columns: 4
  visibility:
  - condition: state
    entity: sensor.lynx_deck_player
    state: ok
- type: tile
  entity: sensor.lynx_deck_player
  name: Player
  color: amber
  grid_options:
    columns: 4
  visibility:
  - condition: state
    entity: sensor.lynx_deck_player
    state_not: ok
- type: tile
  entity: sensor.lynx_deck_hdmi
  name: HDMI out
  color: green
  grid_options:
    columns: 4
  visibility:
  - condition: state
    entity: sensor.lynx_deck_hdmi
    state: connected
- type: tile
  entity: sensor.lynx_deck_hdmi
  name: HDMI out
  color: red
  grid_options:
    columns: 4
  visibility:
  - condition: state
    entity: sensor.lynx_deck_hdmi
    state_not: connected
- type: tile
  entity: sensor.lynx_deck_clock_synchronised
  name: NTP
  color: green
  grid_options:
    columns: 4
  visibility:
  - condition: state
    entity: sensor.lynx_deck_clock_synchronised
    state: 'yes'
- type: tile
  entity: sensor.lynx_deck_clock_synchronised
  name: NTP
  color: amber
  grid_options:
    columns: 4
  visibility:
  - condition: state
    entity: sensor.lynx_deck_clock_synchronised
    state_not: 'yes'
- type: tile
  entity: sensor.lynx_deck_missed_cuts
  name: Missed cuts
  icon: mdi:calendar-alert
  color: green
  grid_options:
    columns: 4
  visibility:
  - condition: state
    entity: sensor.lynx_deck_missed_cuts
    state: '0'
- type: tile
  entity: sensor.lynx_deck_missed_cuts
  name: Missed cuts
  icon: mdi:calendar-alert
  color: red
  grid_options:
    columns: 4
  visibility:
  - condition: state
    entity: sensor.lynx_deck_missed_cuts
    state_not: '0'
- type: tile
  entity: sensor.lynx_deck_clip
  name: On the output
  icon: mdi:filmstrip
  grid_options:
    columns: full
- type: tile
  entity: sensor.lynx_deck_schedule_on_air
  name: Schedule says
  icon: mdi:calendar-clock
  grid_options:
    columns: full
- type: gauge
  entity: sensor.lynx_deck_cpu_temperature
  name: Deck Core
  min: 20
  max: 90
  needle: true
  severity:
    green: 40
    yellow: 70
    red: 80
  grid_options:
    columns: 3
    rows: auto
- type: gauge
  entity: sensor.lynx_deck_cpu_load
  name: Deck Load
  needle: true
  severity:
    green: 0
    yellow: 60
    red: 80
  grid_options:
    columns: 3
    rows: auto
- type: tile
  entity: sensor.lynx_deck_clip_number
  name: Clip number
  icon: mdi:numeric
  grid_options:
    columns: 4
- type: tile
  entity: sensor.lynx_deck_clips
  name: Clips
  icon: mdi:folder-play
  grid_options:
    columns: 4
- type: tile
  entity: sensor.lynx_deck_schedule_entries
  name: Entries on
  icon: mdi:calendar-check
  grid_options:
    columns: 4
- type: tile
  entity: sensor.lynx_deck_scheduled_cuts
  name: Cuts made
  icon: mdi:content-cut
  grid_options:
    columns: 4
- type: tile
  entity: sensor.lynx_deck_decoder_drops
  name: Decoder drops
  icon: mdi:filmstrip-off
  grid_options:
    columns: 4
- type: tile
  entity: sensor.lynx_deck_late_frames
  name: Late frames
  icon: mdi:timer-alert-outline
  grid_options:
    columns: 4
- type: tile
  entity: sensor.lynx_deck_player_restarts
  name: Player restarts
  icon: mdi:restart
  grid_options:
    columns: 4
- type: tile
  entity: sensor.lynx_deck_clock_ahead_by
  name: Clock ahead by
  icon: mdi:clock-fast
  grid_options:
    columns: 4
- type: tile
  entity: sensor.lynx_deck_free_space
  name: Free space
  icon: mdi:sd
  grid_options:
    columns: 4
- type: tile
  entity: sensor.lynx_deck_uptime
  name: Pi uptime
  icon: mdi:timer-outline
  grid_options:
    columns: 4
- type: tile
  entity: sensor.lynx_deck_version
  name: Version
  icon: mdi:tag-outline
  grid_options:
    columns: 4
- type: history-graph
  grid_options:
    columns: full
    rows: 4
  entities:
  - entity: sensor.lynx_deck_state
    name: Deck
  - entity: sensor.lynx_deck_clip
    name: Clip
  title: Last 24 hours
  hours_to_show: 24
